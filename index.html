<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>memory card game</title>
        <link rel="stylesheet " href="style.css">
    </head>
    <body>

        <main class="game">

            <h1 class="game-title"> Anime Memory game
            </h1>
            <section class="game-stats">
                <p class="stat">
                    <span class="stat-label">Moves</span>
                    <span class="stat-value" id="eachMove">0</span>
                </p>

                <p class="stat">
                    <span class="stat-label">Pairs</span>
                    <span class="stat-value" id="counter">0</span>
                </p>

                <p class="stat">
                    <span class="stat-label">Timer</span>
                    <span class="stat-value" id="timerGame">00:00</span>
                </p>
                <!-- <p>Time: <span id="timer">00:00</span></p> -->
            </section>
            <section class="game-board" id="game-board">
            </section>
            <section class="victory-section">
                <p class="victory-message">congrats u found all
                    characters pairs</p>
            </section>
            <button class="restart-button" id="restart">
                restart game
            </button>

            <div class="congrat-popup" id="congratPopup">
                <div class="popup-content">
                    <h2>🎉 Congratulations!</h2>
                    <p>You found all the pairs!</p>
                    <button id="playAgainBtn">Play Again</button>
                </div>
            </div>
        </main>
        <script src="script.js"></script>

    </body>

</html>
